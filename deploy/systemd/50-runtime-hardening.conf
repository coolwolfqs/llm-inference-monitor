[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
# Resource ceilings are safe while legacy system actions still use the
# explicitly allow-listed sudo helpers. NoNewPrivileges/PrivateTmp will be
# enabled after those actions move to a dedicated privileged helper.
MemoryMax=768M
TasksMax=512
LimitNOFILE=8192
OOMPolicy=stop
TimeoutStartSec=30
TimeoutStopSec=20
CPUAccounting=true
MemoryAccounting=true
TasksAccounting=true
